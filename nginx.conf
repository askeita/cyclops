# ====================================================================
# IMPORTANT: This nginx.conf is ONLY for local docker-compose development
# where PHP-FPM runs in a separate 'php' service container.
# ====================================================================
# For Cloud Run deployment, the Dockerfile generates its own config at
# /etc/nginx/http.d/default.conf with fastcgi_pass 127.0.0.1:9000
# (single container deployment with PHP-FPM and Nginx together).
# ====================================================================
# DO NOT use this file in the Docker image for Cloud Run - it will cause
# connection refused errors because 'php:9000' won't resolve.
# ====================================================================

server {
  listen 80;
  server_name localhost;
  root /var/www/html/public;

  index index.php index.html;

  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  location / {
    try_files $uri /index.php$is_args$args;
  }

  location ~ \.php$ {
    try_files $uri = 404;
    include /etc/nginx/fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_read_timeout 60s;
  }

  location ~* \.(?:css|js|ico|gif|jpe?g|png|svg|woff2?|ttf)$ {
    expires 1y;
    access_log off;
    try_files $uri = 404;
  }
}
