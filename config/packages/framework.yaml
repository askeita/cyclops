framework:
    secret: '%env(APP_SECRET)%'
    trusted_hosts: '%env(TRUSTED_HOSTS)%'
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    router:
        utf8: true
    session:
        enabled: true

when@dev:
    framework:
        ide: null

when@prod:
    framework:
        # Explicitly disallow Symfony's own noindex listener from ever firing
        # in prod; safety net in case APP_DEBUG is misconfigured.
        disallow_search_engine_index: false

when@test:
    framework:
        test: true
        secret: 'test_secret' # Default value for APP_SECRET in test environment
        session:
            storage_factory_id: session.storage.factory.mock_file
