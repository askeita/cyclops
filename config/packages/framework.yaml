framework:
    secret: '%env(APP_SECRET)%'
    router:
        utf8: true
    session:
        enabled: true
    # Trust upstream proxy and allowed hostnames from environment
    trusted_hosts: '%env(csv:TRUSTED_HOSTS)%'
    trusted_proxies: '%env(csv:TRUSTED_PROXIES)%'
    trusted_headers:
        - x-forwarded-for
        - x-forwarded-proto
        - x-forwarded-port
        - x-forwarded-host

when@dev:
    framework:
        ide: null

when@test:
    framework:
        test: true
        secret: 'test_secret' # Default value for APP_SECRET in test environment
        session:
            storage_factory_id: session.storage.factory.mock_file
